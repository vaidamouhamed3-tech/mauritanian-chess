<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشطرنج الموريتاني - Mauritanian Chess</title>
    <!-- مكتبات الشطرنج الأساسية للعرض والمنطق -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>الشطرنج بالحسانية 🇲🇷</h1>
        <div id="status" class="status-box">أيو شتمر اللعبة راهي ابدات</div>
    </div>

    <div class="main-container">
        <!-- رقعة الشطرنج -->
        <div id="board" class="board"></div>
        
        <!-- أزرار التحكم واللوحة الجانبية -->
        <div class="controls">
            <button id="restartBtn" onclick="resetGame()">العب مرة ثانية</button>
            <div class="game-info">
                <p id="turnInfo">دور: الأبيض</p>
            </div>
        </div>
    </div>

    <!-- استدعاء المكتبات البرمجية -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
